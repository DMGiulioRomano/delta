# ==============================================================================
# ESEMPIO COMPLETO DI SEZIONE CON BREAKPOINT CURVI
# ==============================================================================
-
    # --- Identificativi della Sezione ---
    nome_sezione: "I. Eruzione, Stasi e Collasso"
    durata: 60
    ratio_temporale: 2 # Usiamo la durata esatta di 60 secondi
    num_attivazioni: 70   # Molte attivazioni per creare una texture densa al culmine

    # --------------------------------------------------------------------------
    # MODELLO TEMPORALE: Il cuore della narrazione musicale
    # --------------------------------------------------------------------------
    # Usiamo una funzione a tratti per scolpire l'evoluzione.
    # Ogni punto è [tempo, valore, forma_curva].
    # 'valore' 0.0 corrisponde a stato_iniziale.
    # 'valore' 1.0 corrisponde a stato_finale.
    # 'forma_curva' > 1.0 = accelerazione (ease-in)
    # 'forma_curva' < 1.0 = decelerazione (ease-out)
    timing_model:
        type: "breakpoint"
        points:
          # --- Punto 1: Inizio ---
          - [0.0, 0.0]

          # --- Punto 2: Eruzione (Sotto-Trend #1) ---
          # Nei primi 40 secondi (0.0 -> 0.66 del tempo), passiamo dallo stato_iniziale (valore 0.0)
          # allo stato_finale (valore 1.0).
          # La forma '3.0' crea un'accelerazione esponenziale: la transizione inizia
          # lentissima, quasi immobile, per poi esplodere con violenza verso la fine.
          - [0.66, 1.0, 3.0]

          # --- Punto 3: Stasi (Sotto-Trend #2) ---
          # Per i successivi 14 secondi (0.66 -> 0.9 del tempo), rimaniamo al picco del caos.
          # Il valore non cambia (resta a 1.0), creando un plateau di massima tensione.
          # La forma è 1.0 (lineare), poiché non c'è una transizione di valore.
          - [0.9, 1.0, 1.0]

          # --- Punto 4: Collasso (Sotto-Trend #3) ---
          # Negli ultimi 6 secondi (0.9 -> 1.0 del tempo), crolliamo dal picco (valore 1.0)
          # di nuovo allo stato iniziale (valore 0.0).
          # La forma '0.4' crea una decelerazione: un crollo rapidissimo all'inizio
          # del segmento che poi rallenta, come la polvere che si deposita.
          - [1.0, 0.0, 0.4]

    # --------------------------------------------------------------------------
    # STATO INIZIALE: Il punto di partenza "Calmo" (corrisponde a valore = 0.0)
    # --------------------------------------------------------------------------
    stato_iniziale:
        ottava:                 {range: [0, 3]}         # Molto grave
        registro:               {range: [1, 5]}         # Ristretto
        dinamica:         {choices: ['ppp', 'pp', 'p'], weights: [0.8, 0.15, 0.05]}
        durata_armonica:        {range: [20.0, 30.0]}   # Suoni lunghissimi e lenti
        moltiplicatore_durata:  {choices: [1.0]}        # Nessuna sovrapposizione
        densita_cluster:        {range: [1, 4]}         # Suoni isolati
        onset_jitter:           {range: [0.0, 0.01]}    # Ritmicamente precisissimo
        tipo_ritmi:             {choices: ['grandi']}   # Ritmi molto lenti
        nonlinear_mode:         {choices: [0]}          # Comportamento stabile, convergente
        inviluppo_attacco:      {value: 'impulsivo'}

    # --------------------------------------------------------------------------
    # STATO FINALE: Il punto di arrivo "Caotico" (corrisponde a valore = 1.0)
    # --------------------------------------------------------------------------
    stato_finale:
        ottava:                 {range: [4, 10]}        # Acutissimo
        registro:               {range: [1, 50]}        # Copre tutto il range
        dinamica:         {choices: ['f', 'mf', 'mf'], weights: [0.8, 0.15, 0.05]}
        durata_armonica:        {range: [20, 30]}    # Eventi brevissimi e frenetici
        moltiplicatore_durata:  {choices: [3.0, 5.0]}   # Forte sovrapposizione, texture continua
        densita_cluster:        {range: [15, 40]}       # Cluster densissimi
        onset_jitter:           {range: [0.1, 0.2]}     # Ritmicamente molto disperso e caotico
        tipo_ritmi:             {choices: ['piccoli']}  # Ritmi velocissimi
        nonlinear_mode:         {choices: [3]}          # Comportamento massimamente caotico
        inviluppo_attacco:      {value: 'impulsivo'}
