# Questo è un file di partitura per il Generative Composer.
# Ogni trattino (-) definisce una nuova sezione della composizione.

-   nome_sezione: "I. Nascita Lenta di Cluster"
    durata: 110
    num_attivazioni: 10 
    ratio_temporale: 1   # <-- AGGIUNGI QUI. La sezione durerà 90 * 1.5 = 135 secondi.
    end_of_section_jitter: 7 # Jitter di mezzo secondo
    timing_model:
        type: "accelerando"
        shape: 2.0
    stato_iniziale:
        ottava:           {range: [0, 2], distribution: "uniform"}
        attenuazione_ottava:
            range_ottava: [5, 7]  # L'intervallo di ottave su cui applicare l'attenuazione
            valore_db: -12       # Quanti dB sottrarre in questo range.
        registro:         {range: [1, 3], distribution: "uniform"}
        ampiezza_db:      {range: [-35, -30], distribution: "uniform"}
        durata_armonica:  {range: [40, 60]}
        densita_cluster:  {range: [2, 4]} 
        tipo_ritmi:       {choices: ['piccoli', 'misti'], weights: [0.9, 0.1]}
        nonlinear_mode:   {choices: [2, 1], weights: [0.8, 0.2]}
    stato_finale:
        ottava:           {range: [3, 8], distribution: "uniform"}
        registro:         {range: [4, 7], distribution: "uniform"}
        ampiezza_db:      {range: [-30, -25], distribution: "uniform"}
        attenuazione_ottava:
            range_ottava: [5, 7]  # L'intervallo di ottave su cui applicare l'attenuazione
            valore_db: -12       # Quanti dB sottrarre in questo range.
        durata_armonica:  {range: [15, 30]}
        densita_cluster:  {range: [8, 15]}
        tipo_ritmi:       {choices: ['grandi', 'misti'], weights: [0.2, 0.8]}
        nonlinear_mode:   {choices: [1, 2], weights: [0.4, 0.6]}

-   nome_sezione: "I. Nascita Lenta di Cluster"
    durata: 90
    num_attivazioni: 0
    ratio_temporale: 0.1   
    timing_model:
        type: "stochastic"
        #shape: 6.0
    stato_iniziale:
        ottava:           {range: [3, 5], distribution: "uniform"}
        registro:         {range: [4, 25], distribution: "uniform"}
        ampiezza_db:      {range: [-30, -25], distribution: "uniform"}
        attenuazione_ottava:
            range_ottava: [5, 7]  # L'intervallo di ottave su cui applicare l'attenuazione
            valore_db: -12       # Quanti dB sottrarre in questo range.
        durata_armonica:  {range: [15, 30]}
        densita_cluster:  {range: [4, 8]}
        spread_spettrale: {range: [0.5, 2.5]}
        tipo_ritmi:       {choices: ['grandi', 'misti'], weights: [0.2, 0.8]}
        nonlinear_mode:   {choices: [1, 2], weights: [0.4, 0.6]}
    stato_finale:
        ottava:           {range: [3, 5], distribution: "uniform"}
        registro:         {range: [4, 25], distribution: "uniform"}
        ampiezza_db:      {range: [-30, -25], distribution: "uniform"}
        attenuazione_ottava:
            range_ottava: [5, 7]  # L'intervallo di ottave su cui applicare l'attenuazione
            valore_db: -12       # Quanti dB sottrarre in questo range.
        durata_armonica:  {range: [15, 30]}
        densita_cluster:  {range: [4, 8]}
        spread_spettrale: {range: [0.5, 2.5]}
        tipo_ritmi:       {choices: ['grandi', 'misti'], weights: [0.2, 0.8]}
        nonlinear_mode:   {choices: [1, 2], weights: [0.4, 0.6]}

