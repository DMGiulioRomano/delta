# Questo è un file di partitura per il Generative Composer.
# Ogni trattino (-) definisce una nuova sezione della composizione.

-   nome_sezione: "I. Te rompo rculo"
    durata: 30
    num_attivazioni: 1
    timing_model:
        type: "accelerando"
        shape: 2.0
    stato_iniziale:
        ottava:           {range: [0, 10], distribution: "uniform"}
        registro:         {range: [1, 50], distribution: "uniform"}
        ampiezza_db:      {range: [-45, -40], distribution: "uniform"}
        durata_armonica:  {range: [10, 15]}
        densita_cluster:  {range: [100, 200]}
        spread_spettrale: {range: [0, 0]}
        tipo_ritmi:       {choices: ['medi', 'piccoli'], weights: [0.9, 0.1]}
        nonlinear_mode:   {choices: [0, 1], weights: [0.8, 0.2]}
    stato_finale:
        ottava:           {range: [4, 5], distribution: "uniform"}
        registro:         {range: [5, 35], distribution: "uniform"}
        ampiezza_db:      {range: [-40, -35], distribution: "uniform"}
        durata_armonica:  {range: [10, 7]}
        densita_cluster:  {range: [20, 50]}
        spread_spettrale: {range: [0, 1]}
        tipo_ritmi:       {choices: ['medi', 'piccoli'], weights: [0.2, 0.8]}
        nonlinear_mode:   {choices: [1, 2], weights: [0.4, 0.6]}

-   nome_sezione: "II. provetta"
    durata: 40
    num_attivazioni: 0
    timing_model:
        type: "accelerando"
        shape: 4.0
    stato_iniziale:
        ottava:           {range: [3, 7], distribution: "uniform"}
        registro:         {range: [1, 10], distribution: "uniform"}
        ampiezza_db:      {range: [-40, -35], distribution: "uniform"}
        durata_armonica:  {range: [5, 10]}
        densita_cluster:  {range: [20, 30]}
        spread_spettrale: {range: [2.0, 3.0]}
        tipo_ritmi:       {choices: ['grandi', 'misti'], weights: [0.9, 0.1]}
        nonlinear_mode:   {choices: [0, 1], weights: [0.8, 0.2]}
    stato_finale:
        ottava:           {range: [2, 3], distribution: "uniform"}
        registro:         {range: [4, 7], distribution: "uniform"}
        ampiezza_db:      {range: [-20, -15], distribution: "uniform"}
        durata_armonica:  {range: [15, 20]}
        densita_cluster:  {range: [15, 20]}
        spread_spettrale: {range: [0.1, 0.5]}
        tipo_ritmi:       {choices: ['grandi', 'misti'], weights: [0.2, 0.8]}
        nonlinear_mode:   {choices: [1, 2], weights: [0.4, 0.6]}
