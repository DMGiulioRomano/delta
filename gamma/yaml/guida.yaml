# ==============================================================================
# GUIDA COMPLETA AL COMPOSITORE GENERATIVO (v2.2)
# ==============================================================================
# Questo file serve sia come documentazione completa che come template per la
# creazione di partiture complesse.
#
# La filosofia del sistema è basata su "maschere di tendenza": invece di
# definire valori fissi, si definiscono gli spazi di possibilità da cui il
# sistema genera i parametri sonori in modo stocastico.

################################################################################
# 1. STRUTTURA DI BASE DI UNA COMPOSIZIONE
################################################################################

# Una composizione è una lista di "sezioni". Ogni sezione, introdotta da un
# trattino (-), è un blocco temporale della musica. Le sezioni vengono eseguite
# in sequenza.
#
# Ogni sezione contiene uno o più "layer" sonori. Un layer è un flusso di
# eventi sonori parallelo e indipendente, con una propria identità e una
# propria evoluzione.
#
# La gerarchia è: Composizione -> Lista di Sezioni -> Lista di Layer per Sezione

# ------------------------------------------------------------------------------
# Esempio di struttura minima di una sezione con un layer:
# ------------------------------------------------------------------------------
-
    # --- A. Parametri a livello di SEZIONE (contesto generale) ---
    nome_sezione: "Nome della Sezione"
    durata: 60  # Durata in secondi

    # --- B. Lista dei LAYER (flussi sonori paralleli) ---
    layers:
      - # --- C. Parametri a livello di LAYER (identità del flusso) ---
        nome_layer: "Nome del Layer"
        num_attivazioni: 50
        timing_model: { type: lineare }

        # --- D. Maschera di Tendenza (il "DNA" sonoro del layer) ---
        stato_unico:
            # ... qui vengono definiti i parametri sonori ...
            ottava: { range: [4, 5] }


################################################################################
# 2. DIZIONARIO DEI PARAMETRI
################################################################################

# Questa sezione è una guida di riferimento per ogni parametro disponibile.
# Per ogni parametro vengono spiegate le modalità d'uso e il suo comportamento
# di default se viene omesso.

# ==============================================================================
# 2.1 PARAMETRI DI SEZIONE
# ==============================================================================

-
    nome_sezione: "Riferimento Parametri di Sezione"
    durata: 60 # (Numero, Obbligatorio) Durata di base in secondi.

    # ratio_temporale: (Numero, Opzionale)
    #   Fattore di scala per la durata della sezione. Utile per "stirare" (> 1)
    #   o "comprimere" (< 1) la sezione senza cambiare altri valori.
    #   Default: 1.0
    ratio_temporale: 1.0

    # inviluppo_sezione: (Stringa, Opzionale)
    #   Applica una curva di ampiezza globale a tutti i suoni della sezione.
    #   I nomi disponibili sono definiti nel file `tables.yaml`.
    #   Default: 'continua' (un valore costante a 1, che non altera il volume).
    inviluppo_sezione: 'crescendo_diminuendo'

# ==============================================================================
# 2.2 PARAMETRI DI LAYER
# ==============================================================================

    layers:
      -
        nome_layer: "Riferimento Parametri di Layer"

        # num_attivazioni: (Intero, Opzionale)
        #   Il numero di "impulsi" che generano suoni. Controlla la densità
        #   generale del layer.
        #   Default: 10
        num_attivazioni: 100

        # timing_model: (Dizionario, Opzionale)
        #   Definisce COME vengono distribuiti nel tempo gli impulsi.
        #   Default: { type: lineare }
        timing_model:
            # type: (Stringa) 'lineare', 'accelerando', 'ritardando', 'stochastic', 'breakpoint'.
            type: lineare
            # shape: (Numero, solo per 'accelerando'/'ritardando') Controlla la curva. >1.0 per un effetto più marcato.
            # points: (Lista, solo per 'breakpoint') Definisce una curva a tratti. Vedi Sezione 3.2.

# ==============================================================================
# 2.3 PARAMETRI DELLE MASCHERE DI TENDENZA
# ==============================================================================
# Questi parametri vivono dentro 'stato_unico' o 'stato_iniziale'/'stato_finale'.
# Per ognuno, sono disponibili diverse MODALITÀ DI GENERAZIONE:

# --- MODALITÀ DI GENERAZIONE ---
# 1. RANGE: Sceglie un valore casuale in un intervallo.
#    - { range: [min, max] } -> Distribuzione uniforme.
#    - { range: [min, max], distribution: normal } -> Distribuzione normale "tagliata" ai limiti.
#
# 2. CHOICES: Sceglie un valore da una lista predefinita.
#    - { choices: [A, B, C] } -> Scelta uniforme (stessa probabilità).
#    - { choices: [A, B, C], weights: [0.7, 0.2, 0.1] } -> Scelta pesata.
#
# 3. VALUE: Forza un valore fisso, senza casualità.
#    - { value: X }
#
# 4. MEAN/STD: Genera un valore da una distribuzione normale pura.
#    - { mean: M, std: S }

        stato_unico:
            # --- Parametri di Altezza ---
            ottava:
              # (Range: 0-10, Opzionale) Controlla l'altezza su larga scala.
              # Default: 5
              range: [3, 6]
            registro:
              # (Range: 1-50, Opzionale) Posizione fine all'interno dell'ottava.
              # Default: 5
              range: [10, 40]

            # --- Parametri di Dinamica e Durata ---
            dinamica:
              # (Stringa, Opzionale) Intensità percepita.
              # Choices: 'ppp', 'pp', 'p', 'mf', 'f', 'ff', 'fff'.
              # Default: 'mf'
              choices: [p, mf, f]
              weights: [0.2, 0.5, 0.3]
            durata_armonica:
              # (Numero, Obbligatorio) Durata di base in secondi per la generazione
              # ritmica. Non ha un default, DEVE essere specificata.
              range: [1.0, 3.0]
            moltiplicatore_durata:
              # (Numero, Opzionale) Fattore di sovrapposizione degli eventi.
              # Se > 1, crea legature e texture continue.
              # Default: Un valore casuale scelto tra 1, 1.25, e 1.6.
              choices: [1.0, 2.0, 4.0]

            # --- Parametri di Texture e Ritmo ---
            densita_cluster:
              # (Intero, Opzionale) Quanti suoni per ogni impulso.
              # Default: 1
              range: [1, 3]
            tipo_ritmi:
              # (Dizionario, Opzionale) Pattern ritmico interno usato da Csound.
              # Default: { choices: ['medi'] }
              # Modalità 1: Categorie -> choices: ['piccoli', 'medi', 'grandi', 'misti']
              # Modalità 2: Lista fissa -> explicit_values: [7, 5, 12]
              # Modalità 3: Scelta tra liste -> choices: [[2,3], [5,8]]
              explicit_values: [3, 5, 2, 8]
            nonlinear_mode:
              # (Intero, Opzionale) Comportamento del generatore ritmico.
              # Choices: 0 (convergente), 1 (periodico), 2 (caotico), 3 (caos "vero").
              # Default: 3
              value: 1

            # --- Parametri di Timbro e Spazializzazione ---
            inviluppo_attacco:
              # (Stringa, Opzionale) Forma dinamica del singolo suono.
              # I nomi disponibili sono definiti in `tables.yaml`.
              # Default: 'lineare'
              choices: [impulsivo, lento]
            senso_movimento:
              # (Intero, Opzionale) Direzione del movimento spaziale.
              # Choices: 1 (antiorario), -1 (orario).
              # Default: 1
              value: -1
            onset_jitter:
              # (Numero, Opzionale) "Sbavatura" temporale degli eventi (in secondi).
              # Definisce la deviazione standard di una distribuzione normale.
              # Default: 0.05
              range: [0.0, 0.01]


################################################################################
# 3. MECCANISMI AVANZATI
################################################################################

# ------------------------------------------------------------------------------
# 3.1 INTERPOLAZIONE DELLE MASCHERE (Layer Dinamici)
# ------------------------------------------------------------------------------

# Se un layer definisce 'stato_iniziale' e 'stato_finale' invece di
# 'stato_unico', i suoi parametri evolvono nel tempo. Ad ogni attivazione,
# il sistema calcola una maschera intermedia interpolando tra i due stati.
#
# L'interpolazione dipende dalla modalità di generazione del parametro:
#
# - Per 'range', 'mean', 'std': I valori numerici (min, max, mean, std) vengono
#   interpolati linearmente.
#   Esempio: Se ottava.range passa da [0,1] a [8,9], a metà sezione il range
#   generato sarà [4,5].
#
# - Per 'choices': I 'weights' (pesi) vengono interpolati con un cross-fade.
#   Esempio: Se dinamica.weights passa da [0.9, 0.1] a [0.1, 0.9], a metà
#   sezione i pesi saranno [0.5, 0.5], rendendo la scelta uniforme.
#   NOTA: Questo funziona solo se la lista 'choices' è identica nei due stati.
#
# - Per 'value' e stringhe: Non vengono interpolati. Il sistema usa il valore
#   dello stato iniziale per la prima metà della sezione e quello dello stato
#   finale per la seconda metà (un cambio netto).

# ------------------------------------------------------------------------------
# 3.2 TIMING MODEL A BREAKPOINT
# ------------------------------------------------------------------------------

# Il timing model 'breakpoint' offre un controllo preciso sulla progressione
# temporale, definendo una curva a tratti.
#
# timing_model:
#   type: breakpoint
#   points:
#     - [t1, v1]
#     - [t2, v2, s2]
#     - [t3, v3, s3]
#
# - t (tempo): Posizione normalizzata nella durata della sezione (da 0.0 a 1.0).
# - v (valore): Valore di progressione temporale da raggiungere in quel punto (da 0.0 a 1.0).
# - s (shape): (Opzionale) Esponente che modella la *curva del segmento precedente*.
#
# Esempio: points: [[0.0, 0.0], [0.8, 1.0, 0.4]]
#   - Il tempo scorre da 0.0 a 0.8 (l'80% della durata della sezione).
#   - In questo intervallo, la progressione degli eventi va da 0.0 a 1.0 (vengono generati tutti gli eventi).
#   - La curva ha una forma di 0.4: è un "ease-out", quindi la maggior parte degli eventi
#     si concentrerà all'inizio di questo segmento.
#   - Nell'ultimo 20% della durata (da 0.8 a 1.0), non verranno generati eventi.


################################################################################
# 4. ESEMPI PRATICI
################################################################################

# --- Esempio 1: Sezione Polifonica Complessa ---
-
    nome_sezione: "I. Contrappunto di Texture"
    durata: 45
    inviluppo_sezione: 'crescendo_diminuendo'
    layers:
      - nome_layer: "Drone Basso e Lento"
        num_attivazioni: 20
        timing_model: { type: "ritardando", shape: 2.0 }
        stato_iniziale:
          ottava: { range: [0, 1] }
          registro: { range: [1, 10] }
          dinamica: { value: 'p' }
          durata_armonica: { range: [7, 10] }
          inviluppo_attacco: { value: 'lento' }
        stato_finale:
          ottava: { range: [1, 2] }
          registro: { range: [5, 20] }
          dinamica: { value: 'mf' }
          durata_armonica: { range: [5, 8] }

      - nome_layer: "Scintillii Acuti e Stocastici"
        num_attivazioni: 120
        timing_model: { type: "stochastic" }
        stato_unico:
          ottava: { mean: 9, std: 1.0 }
          dinamica: { choices: ['ppp', 'pp'], weights: [0.8, 0.2] }
          durata_armonica: { range: [0.2, 0.8] }
          inviluppo_attacco: { value: 'impulsivo' }
          nonlinear_mode: { value: 3 }
          onset_jitter: { range: [0.0, 0.1] }
          densita_cluster: { value: 1 }

# --- Esempio 2: Sezione "vecchio stile" per retrocompatibilità ---
-
    nome_sezione: "II. Stasi Ritmica"
    durata: 30
    num_attivazioni: 80
    timing_model: { type: "lineare" }
    stato_unico:
        ottava: { value: 5 }
        registro: { range: [10, 40] }
        durata_armonica: { value: 1.0 }
        densita_cluster: { value: 1 }
        tipo_ritmi: { explicit_values: [4, 3, 5] }
        nonlinear_mode: { value: 1 } # Periodico