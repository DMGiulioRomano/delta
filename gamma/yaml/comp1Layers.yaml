# ===================================================================
# ESEMPIO DI COMPOSIZIONE CON LAYER (v2.0)
# Mostra la nuova sintassi per sezioni multi-layer.
# ===================================================================

# --- SEZIONE 1: Introduzione (Formato Mono-layer) ---
# Questa sezione ha un solo processo generativo, come nel vecchio formato.
# Usiamo la retrocompatibilità del generatore.
- nome_sezione: "1. Introduzione Nebulosa"
  durata: 30
  ratio_temporale: 1.0
  
  # Stato iniziale
  stato_iniziale:
    ottava: { range: [4, 5] }
    registro: { range: [3, 7] }
    durata_armonica: { range: [5, 8] }
    ampiezza_db: { range: [-25, -20] }
    densita_cluster: { range: [1, 2] }
    tipo_ritmi: { choices: ['piccoli'] }
    nonlinear_mode: { choices: [1] }

  # Stato finale
  stato_finale:
    ottava: { range: [5, 6] }
    registro: { range: [1, 5] }
    durata_armonica: { range: [3, 5] }
    ampiezza_db: { range: [-20, -18] }
    densita_cluster: { range: [2, 3] }
    tipo_ritmi: { choices: ['medi'] }
    nonlinear_mode: { choices: [2] }
  
  # Parametri di generazione per questa singola "voce"
  num_attivazioni: 15
  timing_model: { type: 'ritardando', shape: 1.5 }
  end_of_section_jitter: 0.5


# --- SEZIONE 2: Sviluppo Contrappuntistico (Formato Multi-layer) ---
# Questa sezione è un contenitore per processi paralleli.
- nome_sezione: "2. Sviluppo Contrappuntistico"
  durata: 90
  ratio_temporale: 1.0 # Velocità normale

  layers: # La chiave 'layers' attiva la nuova logica

    # Layer A: Un bordone grave e statico che dura per tutta la sezione
    - nome_layer: "Bordone Grave Continuo"
      start_time_ratio: 0.0  # Inizia subito (0% della durata della sezione)
      end_time_ratio: 1.0    # Finisce alla fine (100% della durata della sezione)
      
      # Questo layer non evolve, quindi usiamo 'stato_unico'
      stato_unico:
        ottava: { range: [1, 2] }
        registro: { range: [1, 4] }
        durata_armonica: { range: [10, 15] } # Durate molto lunghe
        ampiezza_db: { range: [-18, -16] }
        densita_cluster: { range: [1, 1] } # Un solo evento per attivazione
        tipo_ritmi: { choices: ['piccoli'] }
        nonlinear_mode: { choices: [1] }
      
      num_attivazioni: 8 # Poche attivazioni, dato che sono eventi lunghi
      timing_model: { type: 'stochastic' } # Attivazioni sparse casualmente

    # Layer B: Una figura melodica veloce che appare dopo e accelera
    - nome_layer: "Impulsi Ritmici Acuti"
      start_time_ratio: 0.10 # Entra al 10% del tempo (a 9 secondi)
      end_time_ratio: 0.85   # Esce all'85% (a 76.5 secondi)
      
      stato_iniziale:
        ottava: { range: [7, 7] }
        registro: { range: [1, 10] }
        durata_armonica: { range: [1.0, 1.5] }
        ampiezza_db: { range: [-28, -25] }
        densita_cluster: { range: [2, 4] }
        tipo_ritmi: { choices: ['grandi'] } # Ritmi veloci
        nonlinear_mode: { choices: [3] }
      
      stato_finale:
        ottava: { range: [8, 9] }
        registro: { range: [5, 10] }
        durata_armonica: { range: [0.2, 0.5] } # Diventa ancora più veloce
        ampiezza_db: { range: [-15, -12] } # Emerge in primo piano
        densita_cluster: { range: [5, 8] } # Diventa più denso
        tipo_ritmi: { choices: ['misti'] }
        nonlinear_mode: { choices: [3] }
      
      num_attivazioni: 50 # Molte attivazioni
      timing_model: { type: 'accelerando', shape: 2.5 } # Forte accelerazione
      end_of_section_jitter: 0.1 # Poco jitter, per un finale più netto

    # Layer C: Eventi "a goccia" sparsi nella regione media
    - nome_layer: "Gocce Medie"
      start_time_ratio: 0.33 # Entra a un terzo della sezione
      end_time_ratio: 1.0    # Continua fino alla fine
      
      stato_unico:
        ottava: { mean: 5.5, std: 0.5 } # Distribuzione normale centrata su ottava 5.5
        registro: { choices: [1, 3, 5, 7, 9] } # Scelte da una lista
        durata_armonica: { range: [2, 3] }
        ampiezza_db: { range: [-22, -19] }
        densita_cluster: { range: [1, 1] }
        tipo_ritmi: { choices: ['medi'] }
        nonlinear_mode: { choices: [2] }
      
      num_attivazioni: 25
      timing_model: { type: 'linear' }


# --- SEZIONE 3: Coda rarefatta ---
# Un'altra sezione multi-layer per mostrare un fade-out
- nome_sezione: "3. Coda"
  durata: 40
  ratio_temporale: 1.5 # Rallenta tutto (durata effettiva 60s)

  layers:
    # Layer di dissolvenza
    - nome_layer: "Dissolvenza Finale"
      start_time_ratio: 0.0
      end_time_ratio: 0.95 # Non arriva proprio alla fine
      
      stato_iniziale:
        ottava: { range: [6, 7] }
        durata_armonica: { range: [2, 4] }
        ampiezza_db: { range: [-15, -12] }
        densita_cluster: { range: [3, 5] }
      
      stato_finale:
        ottava: { range: [8, 9] }
        durata_armonica: { range: [8, 12] } # Molto più lungo
        ampiezza_db: { range: [-40, -35] } # Molto più piano
        densita_cluster: { range: [1, 1] } # Molto più rado

      # Parametri comuni a inizio e fine
      tipo_ritmi: { choices: ['piccoli'] }
      registro: { range: [1, 5] }
      nonlinear_mode: { choices: [1] }

      num_attivazioni: 20
      timing_model: { type: 'ritardando', shape: 3.0 } # Forte rallentamento