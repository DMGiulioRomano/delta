-   nome_sezione: "I. Nascita Lenta di Cluster"
    durata: 140
    ratio_temporale: .75   # <-- AGGIUNGI QUI. La sezione durerà 90 * 1.5 = 135 secondi.
    #inviluppo_sezione: 'sezioneI' # Nome del nuovo inviluppo globale
    layers:
      - nome_layer: "salita di gamma"
        lifespan: [0, 1]  # Attivo per tutta la durata della sezione
        num_attivazioni: 20      
        timing_model:
            type: "accelerando"
            shape: 2.0
        stato_iniziale:
            ottava:           {range: [0, 2], distribution: "uniform"}
            registro:         {range: [1, 3], distribution: "uniform"}
            durata_armonica:  {range: [30, 40]}
            densita_cluster:  {range: [2, 4]} 
            onset_jitter: { range: [0.0, 0.0] }
            dinamica: 'ff'
            tipo_ritmi:
              # (Dizionario, Opzionale) Pattern ritmico interno usato da Csound.
              # Default: { choices: ['medi'] }
              # Modalità 1: Categorie -> choices: ['piccoli', 'medi', 'grandi', 'misti']
              # Modalità 2: Lista fissa -> explicit_values: [7, 5, 12]
              # Modalità 3: Scelta tra liste -> choices: [[2,3], [5,8]]
              explicit_values: [3, 2, 4, 5, 3, 2, 4, 1, 3, 2, 4]
            nonlinear_mode:   {choices: [1, 0], weights: [0.8, 0.2]}
            inviluppo_attacco: 'lineare'
        stato_finale:
            dinamica: 'ff'
            ottava:           {range: [3, 8],      interp_shape: 2.0}
            registro:         {range: [1, 20], distribution: "uniform"}
            durata_armonica:  {range: [15, 30]}
            densita_cluster:  {range: [4, 7]}
            nonlinear_mode:   {choices: [1, 0], weights: [0.4, 0.6]}

      - nome_layer: "scintillii"
        lifespan: [.8, 1]  # Attivo per tutta la durata della sezione
        num_attivazioni: 40 #1      
        timing_model:
            type: "stochastic"
        stato_iniziale:
            dinamica: 'ppp'
            ottava:           {range: [5, 8], distribution: "uniform"}
            registro:         {range: [1, 8], distribution: "uniform"}
            durata_armonica:  {range: [1, 5]}
            densita_cluster:  {range: [10, 40]}
            nonlinear_mode:   {choices: [1, 0], weights: [0.4, 0.6]}
            inviluppo_attacco: 'lineare'
            tipo_ritmi:
              explicit_values: [3, 2, 4, 5, 3, 2, 4, 1, 3, 2, 4]
        stato_finale:
            dinamica: 'p'
            ottava:           {range: [5, 8], distribution: "uniform"}
            registro:         {range: [1, 50], distribution: "uniform"}
            durata_armonica:  {range: [.9, 3]}
            densita_cluster:  {range: [10, 40]}
            nonlinear_mode:   {choices: [1, 0], weights: [0.4, 0.6]}
            inviluppo_attacco: 'impulsivo'
            onset_jitter: 10
            tipo_ritmi:
              explicit_values: [3, 2, 4, 5, 3, 2, 4, 1, 3, 2, 4]

-   nome_sezione: "II. Nascita Rapida di Cluster"
    durata: 140
    ratio_temporale: .3   # <-- AGGIUNGI QUI. La sezione durerà 90 * 1.5 = 135 secondi.
    inviluppo_sezione: 'impulso' # Nome del nuovo inviluppo globale
    layers:
      - nome_layer: "salita di gamma"
        lifespan: [0, 1]  # Attivo per tutta la durata della sezione
        num_attivazioni: 3      
        timing_model:
            type: "ritardando"
            shape: 2.0
        stato_iniziale:
            ottava:           {range: [0, 8], distribution: "uniform"}
            registro:         {range: [1, 20], distribution: "uniform"}
            durata_armonica:  {range: [30, 40]}
            densita_cluster:  {range: [70, 100]} 
            onset_jitter: { range: [0.6, 2.6] }
            dinamica: 'mf'
            tipo_ritmi:
              # (Dizionario, Opzionale) Pattern ritmico interno usato da Csound.
              # Default: { choices: ['medi'] }
              # Modalità 1: Categorie -> choices: ['piccoli', 'medi', 'grandi', 'misti']
              # Modalità 2: Lista fissa -> explicit_values: [7, 5, 12]
              # Modalità 3: Scelta tra liste -> choices: [[2,3], [5,8]]
              explicit_values: [3, 2, 4, 5, 3, 2, 4, 1, 3, 2, 4]
            nonlinear_mode:   {choices: [1, 0], weights: [0.8, 0.2]}
            inviluppo_attacco: 'impulsivo'
        stato_finale:
            dinamica: 'ff'
            onset_jitter: { range: [0.3, 6.6] }
            ottava:           {range: [3, 8], distribution: "uniform"}
            registro:         {range: [1, 20], distribution: "uniform"}
            durata_armonica:  {range: [15, 30]}
            densita_cluster:  {range: [1, 7]}
            nonlinear_mode:   {choices: [1, 0], weights: [0.4, 0.6]}
      - nome_layer: "part 2"
        lifespan: [.8, 1]  # Attivo per tutta la durata della sezione
        num_attivazioni: 0 #1      
        timing_model:
            type: "stochastic"
        stato_unico:
            dinamica: 'p'
            ottava:           {range: [5, 8], distribution: "uniform"}
            registro:         {range: [1, 50], distribution: "uniform"}
            durata_armonica:  {range: [10, 15]}
            densita_cluster:  {range: [10, 40]}
            nonlinear_mode:   {choices: [1, 0], weights: [0.4, 0.6]}
            onset_jitter: 4
            tipo_ritmi:
              explicit_values: [3, 2, 4, 5, 3, 2, 4, 1, 3, 2, 4]





-   nome_sezione: "I. Nascita Lenta di Cluster"
    durata: 140
    ratio_temporale: .75   # <-- AGGIUNGI QUI. La sezione durerà 90 * 1.5 = 135 secondi.
    layers:
      - nome_layer: "Scintillii Acuti e Stocastici"
        num_attivazioni: 0 #120
        timing_model: { type: "stochastic" }
        stato_iniziale:
            moltiplicatore_durata: 
                choices: [3.0, 2.0, 4.0]
            ottava: { range: [7, 8] }
            registro: { mean: 25, std: 10 }
            dinamica: 'ppp'
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.0, 0.1] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.2, 0.8]}
            densita_cluster: { range: [1, 6] }
            inviluppo_attacco: 'impulsivo'
        stato_finale:
            moltiplicatore_durata:
                choices: [1.0, 2.0, 1.0]
            ottava: { range: [8, 9] }
            registro: { mean: 25, std: 2 }
            dinamica: 'f'
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.4, 0.1] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.8, 0.2]}
            densita_cluster: { range: [10, 60] }
            inviluppo_attacco: 'impulsivo'

      - nome_layer: "Scintillii Acuti e Stocastici"
        num_attivazioni: 0 #70
        timing_model: { type: "stochastic" }
        stato_iniziale:
            ottava: { range: [5, 7] }
            registro: { mean: 25, std: 10 }
            dinamica: { choices: ['p', 'mf', 'f'], weights: [0.6, 0.4, 0.0] }
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.0, 0.1] }
            densita_cluster: { range: [1, 6] }
            inviluppo_attacco: 'triangolo'
        stato_finale:
            ottava: { range: [4, 5] }
            registro: { mean: 25, std: 40 }
            dinamica: { choices: ['p', 'mf', 'f'], weights: [0.3, 0.4, 0.3] }
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.0, 0.1] }
            densita_cluster: { range: [1, 6] }
            inviluppo_attacco: 'triangolo'

      - nome_layer: "momento angolare"
        lifespan: [0.3, 1]  # Attivo per tutta la durata della sezione
        num_attivazioni: 0
        timing_model:
            type: "ritardando"
            shape: 2.0
        stato_iniziale:
            ottava:           {mean: 5, std: 3}
            registro:         {range: [1, 50], distribution: "uniform"}
            dinamica: 'f'
            durata_armonica:  {range: [20, 30]}
            densita_cluster:  {range: [50, 100]}
            spread_spettrale: {range: [0, 0]}
            tipo_ritmi:       {choices: ['medi', 'piccoli'], weights: [0.9, 0.1]}
            nonlinear_mode:   {choices: [0, 1], weights: [0.8, 0.2]}
        stato_finale:   
            ottava:           {mean: 7, std: 0}
            registro:         {range: [10, 13], distribution: "uniform"}
            dinamica: 'p'
            durata_armonica:  {range: [10, 15]} 
            densita_cluster:  {range: [15, 20]}
            spread_spettrale: {range: [0, 0]}
            tipo_ritmi:       {choices: ['medi', 'misti'], weights: [0.2, 0.8]}
            nonlinear_mode:   {choices: [1, 2], weights: [0.4, 0.6]}
