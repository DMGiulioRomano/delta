# Questo è un file di partitura per il Generative Composer.
# Ogni trattino (-) definisce una nuova sezione della composizione.

-   nome_sezione: "I. Nascita Lenta di Cluster"
    durata: 15
    ratio_temporale: 1.0
    num_attivazioni: 1
    timing_model:
        type: "stochastic"
    stato_unico:
        ottava:           {range: [0, 2], distribution: "uniform"}
        registro:         {range: [10, 40], distribution: "uniform"}
        dinamica:         {choices: ['f', 'pp', 'mf'], weights: [0.8, 0.15, 0.05]}
        durata_armonica:  {range: [10, 10]}
        densita_cluster:  {range: [8, 15]}
        tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.9, 0.1]}
        nonlinear_mode:   {choices: [0, 1], weights: [0.8, 0.2]}

-   nome_sezione: "II. Nascita Lenta di Cluster"
    durata: 7
    ratio_temporale: 1.0
    num_attivazioni: 7
    timing_model:
        type: "accelerando"
        shape: 1.2
    stato_iniziale:
        ottava:           {range: [2, 5], distribution: "uniform"}
        registro:         {range: [10, 20], distribution: "uniform"}
        dinamica:         {choices: ['ppp']}
        durata_armonica:  {range: [1, 1]}
        densita_cluster:  {range: [3, 5]}
        tipo_ritmi:       {choices: ['piccoli']}
        nonlinear_mode:   {choices: [0, 1], weights: [0.8, 0.2]}
        inviluppo_attacco: 'impulsivo'

    stato_finale:
        ottava:           {range: [4, 7], distribution: "uniform"}
        registro:         {range: [1, 40], distribution: "uniform"}
        dinamica:         {choices: ['mf']}
        durata_armonica:  {range: [2, 2]}
        densita_cluster:  {range: [30, 70]}
        tipo_ritmi:       {choices: ['piccoli']}
        nonlinear_mode:   {choices: [0, 1], weights: [0.4, 0.6]}
        inviluppo_attacco: 'impulsivo'

-   nome_sezione: "I. Te rompo rculo"
    durata: 40
    ratio_temporale: 0.2 
    num_attivazioni: 5
    timing_model:
        type: "accelerando"
        shape: 2.0
    stato_iniziale:
        ottava:           {mean: 5, std: 2}
        registro:         {range: [1, 50], distribution: "uniform"}
        dinamica:         {choices: ['ppp']}
        durata_armonica:  {range: [5, 10]}
        densita_cluster:  {range: [10, 20]}
        spread_spettrale: {range: [0, 0]}
        tipo_ritmi:       {choices: ['medi', 'piccoli'], weights: [0.9, 0.1]}
        nonlinear_mode:   {choices: [0, 1], weights: [0.8, 0.2]}
    stato_finale:
        ottava:           {mean: 5, std: 0}
        registro:         {range: [10, 13], distribution: "uniform"}
        dinamica:         {choices: ['ppp']}
        durata_armonica:  {range: [6, 10]} 
        densita_cluster:  {range: [15, 20]}
        spread_spettrale: {range: [0, 0]}
        tipo_ritmi:       {choices: ['medi', 'misti'], weights: [0.2, 0.8]}
        nonlinear_mode:   {choices: [1, 2], weights: [0.4, 0.6]}

-   nome_sezione: "I. Nascita Lenta di Cluster"
    durata: 90
    ratio_temporale: .75   # <-- AGGIUNGI QUI. La sezione durerà 90 * 1.5 = 135 secondi.
    layers:
      - nome_layer: "Scintillii Acuti e Stocastici"
        num_attivazioni: 100

        timing_model:
            type: "accelerando"
            shape: 2.0
        stato_iniziale:
            ottava:           {range: [0, 2], distribution: "uniform"}
            attenuazione_ottava:
                range_ottava: [5, 7]  # L'intervallo di ottave su cui applicare l'attenuazione
                valore_db: -10      # Quanti dB sottrarre in questo range.
            registro:         {range: [1, 3], distribution: "uniform"}
            dinamica:         {choices: ['ppp']}
            durata_armonica:  {range: [30, 40]}
            densita_cluster:  {range: [2, 4]} 
            tipo_ritmi:       {choices: ['piccoli', 'misti'], weights: [0.9, 0.1]}
            nonlinear_mode:   {choices: [2, 1], weights: [0.8, 0.2]}
        stato_finale:
            ottava:           {range: [3, 8], distribution: "uniform"}
            registro:         {range: [4, 20], distribution: "uniform"}
            dinamica:         {choices: ['f']}
            attenuazione_ottava:
                range_ottava: [5, 7]  # L'intervallo di ottave su cui applicare l'attenuazione
                valore_db: -12       # Quanti dB sottrarre in questo range.
            durata_armonica:  {range: [15, 30]}
            densita_cluster:  {range: [8, 15]}
            tipo_ritmi:       {choices: ['grandi', 'misti'], weights: [0.2, 0.8]}
            nonlinear_mode:   {choices: [1, 2], weights: [0.4, 0.6]}

      - nome_layer: "Scintillii Acuti e Stocastici"
        num_attivazioni: 120
        timing_model: { type: "stochastic" }
        stato_unico:
            ottava: { range: [7, 9] }
            registro: { mean: 25, std: 10 }
            dinamica: { choices: ['ppp', 'p'] }
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.0, 0.1] }
            densita_cluster: { range: [1, 6] }
            inviluppo_attacco: { choices: ['impulsivo', 'impulsivo'] }
