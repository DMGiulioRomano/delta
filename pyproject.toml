[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "delta"
version = "0.1.0"
description = "Sintesi sonora algoritmica: YAML -> CSD -> Csound"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "numpy",
    "matplotlib",
    "plotly",
]

[tool.setuptools.packages.find]
where = ["src"]
